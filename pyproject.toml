# Tool configuration only. Dependencies stay in requirements*.txt (pinned).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen explicitly rather than left to ruff's defaults: the defaults change
# between ruff releases, and a rule set that moves under you is how a lint job
# starts failing with no change to the code.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF100"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
